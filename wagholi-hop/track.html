<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4aa8d0" />
    <title>Live track · WagholiHop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  </head>
  <body class="track-page">
    <div id="app" class="track-shell">
      <header class="topbar-track">
        <div class="brand">
          <span class="brand-mark">WH</span>
          <div>
            <p class="brand-kicker">Family safety</p>
            <h1 style="margin:0;font-family:var(--display);font-size:1.6rem">Live track</h1>
          </div>
        </div>
        <img class="track-auto-thumb" src="./assets/auto-hero.png" alt="" width="88" height="56" />
      </header>

      <div id="sos-banner" class="sos-banner" hidden>
        SOS active — rider requested emergency help
      </div>

      <section class="panel accent-edge">
        <div class="section-head">
          <h3 id="route-title">Loading trip…</h3>
          <span class="status-dot live" id="live-dot"></span>
        </div>
        <div id="live-map" class="live-map map-host" aria-label="Live vehicle map"></div>
        <p class="muted" id="status-line">Connecting…</p>
        <div class="fare-row">
          <div>
            <span class="muted">Driver</span>
            <strong id="driver-line">—</strong>
          </div>
          <div>
            <span class="muted">Vehicle</span>
            <strong id="vehicle-line">—</strong>
          </div>
          <div>
            <span class="muted">Progress</span>
            <strong id="progress-line">0%</strong>
          </div>
        </div>
        <div class="ride-actions">
          <a class="primary-btn call-link" href="tel:112">Call 112</a>
          <a class="ghost-btn" id="open-app" href="./index.html">Open app</a>
        </div>
        <p class="hint" id="track-hint">Uses Mapbox when a token is saved in the main app.</p>
      </section>
    </div>

    <style>
      .topbar-track {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .track-auto-thumb {
        width: 96px;
        height: auto;
        filter: drop-shadow(0 8px 12px rgba(0,0,0,.15));
        animation: idle-bob 3s ease-in-out infinite;
      }
    </style>

    <script type="module">
      import {
        decodeSharePayload,
        readLive,
        vehiclePosition,
        vehicleLatLng,
        rideProgress,
        renderTrackMap,
        statusSafetyLabel,
      } from "./js/safety.js";
      import { hasMapbox } from "./js/config.js";
      import { HopMap } from "./js/maps.js";

      const $ = (s) => document.querySelector(s);
      let snapshot = null;
      let hopMap = null;

      function loadFromHash() {
        const hash = location.hash.replace(/^#/, "");
        if (!hash) return readLive();
        return decodeSharePayload(hash) || readLive();
      }

      function paint() {
        if (!snapshot) return;
        if (hasMapbox()) {
          const host = $("#live-map");
          if (!hopMap) {
            host.innerHTML = "";
            host.dataset.mapbox = "1";
            hopMap = new HopMap(host);
            hopMap.init();
          }
          const pickup = snapshot.pickup || {
            lat: snapshot.pickupCoords?.lat,
            lng: snapshot.pickupCoords?.lng,
          };
          const drop = snapshot.drop || {
            lat: snapshot.dropCoords?.lat,
            lng: snapshot.dropCoords?.lng,
          };
          const vehicle = vehicleLatLng(snapshot) ||
            (snapshot.vehicleLat != null
              ? { lat: snapshot.vehicleLat, lng: snapshot.vehicleLng }
              : null);

          if (pickup?.lat != null) hopMap.setMarker("pickup", pickup, { label: "P", className: "mbx-pickup" });
          if (drop?.lat != null) hopMap.setMarker("drop", drop, { label: "D", className: "mbx-drop" });
          if (vehicle) hopMap.setMarker("vehicle", vehicle, { label: "🛺", className: "mbx-vehicle" });
          hopMap.setRoute(snapshot.routeGeometry || null);
          hopMap.fitPoints([pickup, drop, vehicle].filter((p) => p?.lat != null));
          $("#track-hint").textContent = "Mapbox live track";
        } else {
          renderTrackMap($("#live-map"), snapshot, { label: "🛺" });
          $("#track-hint").textContent = "Open main app, save Mapbox token, then share again for road map.";
        }
      }

      function refresh() {
        const live = readLive();
        if (live && snapshot && live.id === snapshot.id) {
          snapshot = { ...snapshot, ...live };
        } else if (live && !snapshot) {
          snapshot = live;
        } else if (!snapshot) {
          snapshot = loadFromHash();
        }

        if (!snapshot) {
          $("#route-title").textContent = "No live trip";
          $("#status-line").textContent = "Ask the rider to Share live track from WagholiHop.";
          return;
        }

        const pos = vehiclePosition(snapshot);
        const progress = rideProgress(snapshot);
        snapshot.vehicleX = pos.x;
        snapshot.vehicleY = pos.y;
        snapshot.progress = progress;
        const gps = vehicleLatLng(snapshot);
        if (gps) {
          snapshot.vehicleLat = gps.lat;
          snapshot.vehicleLng = gps.lng;
        }

        $("#route-title").textContent = `${snapshot.from} → ${snapshot.to}`;
        $("#status-line").textContent = statusSafetyLabel(snapshot.status);
        $("#driver-line").textContent = snapshot.driverName || "Assigning";
        $("#vehicle-line").textContent = snapshot.vehicle || "—";
        $("#progress-line").textContent = `${Math.round(progress * 100)}%`;
        $("#sos-banner").hidden = !snapshot.sos;
        document.body.classList.toggle("sos-mode", !!snapshot.sos);
        paint();
      }

      snapshot = loadFromHash();
      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
