name: Build WagholiHop Android APK

on:
  push:
    branches: [main]
    paths:
      - "wagholi-hop/**"
      - ".github/workflows/wagholi-hop-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wagholi-hop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run build

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        working-directory: .
        run: cp wagholi-hop/android/app/build/outputs/apk/debug/app-debug.apk wagholi-hop.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wagholi-hop-apk
          path: wagholi-hop.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wagholi-hop-android-latest
          name: WagholiHop (Android APK)
          body: |
            Latest installable Android debug APK for **WagholiHop**.

            How to install on your phone:
            1. Open this page on your Android phone.
            2. Download `wagholi-hop.apk`.
            3. Tap it, allow "Install unknown apps" for your browser if prompted, then Install.
          files: wagholi-hop.apk
          make_latest: false
