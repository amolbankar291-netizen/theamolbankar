name: Deploy WagholiHop (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "wagholi-hop/**"
      - "calorie-calculator.html"
      - "assets/calorie-bg.jpg"
      - ".github/workflows/deploy-wagholi-hop.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-wagholi-hop
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add calorie calculator to site
        run: |
          mkdir -p wagholi-hop/assets
          cp calorie-calculator.html wagholi-hop/calorie-calculator.html
          cp assets/calorie-bg.jpg wagholi-hop/assets/calorie-bg.jpg

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wagholi-hop

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
